        .moving-grid {

            z-index: -1; opacity: 0.3; animation: grid-scroll 20s linear infinite; pointer-events: none;
        }

        @keyframes grid-scroll { from { background-position: 0 0; } to { background-position: 50px 50px; } }

        .grain-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("https://www.transparenttextures.com/patterns/carbon-fibre.png");
            opacity: 0.02; pointer-events: none; z-index: 0;

                                        <div className="absolute inset-0 z-30 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all duration-500 scale-75 group-hover:scale-100 pointer-events-none">
                                            <div className="bg-white/10 backdrop-blur-md text-white border border-white/20 p-5 rounded-full shadow-2xl">
                                                <Icon name="play" size={32} color="white" />
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </section>

                            {/* ARCHIVE GRID - TYPOGRAPHY GRADIENT THUMBNAILS */}
                            <section id="work" className="py-32 px-6 border-t border-white/5">
                                <div className="max-w-7xl mx-auto">
                                    <div className="flex flex-col md:flex-row justify-between items-center mb-16 gap-8">
                                        <h2 className="text-5xl font-heading font-extrabold uppercase italic tracking-tighter">Archive.</h2>
                                        <div className="flex flex-wrap gap-2 p-1 bg-white/5 rounded-sm">
                                            {categories.map(c => (
                                                <button key={c} onClick={() => setActiveFilter(c)} className={`text-[9px] font-bold uppercase tracking-widest px-6 py-2 transition-all duration-300 ${activeFilter === c ? 'bg-purple-600 text-white shadow-lg' : 'hover:bg-white/10 text-white/40'}`}>{c}</button>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                                        {filteredProjects.map(p => (
                                            <div key={p.id} className="group relative aspect-square border border-white/5 rounded-sm overflow-hidden cursor-pointer shadow-2xl transition-all duration-500 hover:border-purple-500/30 bg-black hover:-translate-y-2 hover:shadow-purple-950/20" onClick={() => setSelectedVideo(p)}>
                                                
                                                {/* Gradient Background relative to category */}
                                                <div className={`absolute inset-0 bg-gradient-to-br transition-all duration-700 ${
                                                    p.category === 'Video Editing' 
                                                        ? 'from-blue-950/80 via-black to-black group-hover:from-blue-900/90' 
                                                        : p.category === 'Motion Graphics' 
                                                        ? 'from-purple-950/80 via-black to-black group-hover:from-purple-900/90' 
                                                        : 'from-emerald-950/80 via-black to-black group-hover:from-emerald-900/90'
                                                }`}></div>

                                                {/* Neon Spotlight Ambient in Corner */}
                                                <div className={`absolute -top-20 -left-20 w-48 h-48 rounded-full blur-[80px] opacity-30 transition-all duration-700 group-hover:opacity-60 ${
                                                    p.category === 'Video Editing' ? 'bg-blue-500' : p.category === 'Motion Graphics' ? 'bg-purple-500' : 'bg-emerald-500'
                                                }`}></div>

                                                {/* Central Elegant Title Art */}
                                                <div className="absolute inset-0 flex flex-col items-center justify-center p-8 z-20 select-none">
                                                    <h4 className="font-heading text-2xl sm:text-3xl italic uppercase tracking-tighter text-center text-white/40 group-hover:text-white group-hover:scale-105 transition-all duration-500 leading-none">
                                                        {p.title}
                                                    </h4>
                                                    <div className={`w-8 h-[1px] mt-4 transition-all duration-500 group-hover:w-16 ${
                                                        p.category === 'Video Editing' ? 'bg-blue-500/50 group-hover:bg-blue-500' : p.category === 'Motion Graphics' ? 'bg-purple-500/50 group-hover:bg-purple-500' : 'bg-emerald-500/50 group-hover:bg-emerald-500'
                                                    }`}></div>
                                                </div>

                                                {/* Play Button Indicator */}
                                                <div className="absolute inset-0 z-30 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all duration-500 scale-75 group-hover:scale-100 pointer-events-none">
                                                    <div className="bg-white/10 backdrop-blur-md text-white border border-white/20 p-4 rounded-full shadow-2xl">
                                                        <Icon name="play" size={24} color="white" />
                                                    </div>
                                                </div>

                                                {/* Bottom Metadata Bar */}
                                                <div className="absolute bottom-8 left-8 right-8 text-left z-20 flex justify-between items-end opacity-40 group-hover:opacity-100 transition-opacity duration-300">
                                                    <div className="flex items-center gap-2">
                                                        <div className={`w-1.5 h-1.5 rounded-full ${p.category === 'Video Editing' ? 'bg-blue-500' : p.category === 'Motion Graphics' ? 'bg-purple-500' : 'bg-emerald-500'}`}></div>
                                                        <span className="text-[9px] uppercase font-bold text-white tracking-[0.2em]">{p.category}</span>
                                                    </div>
                                                    <span className="text-[9px] font-mono text-white/30">#{p.id}</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </section>

                            <footer className="py-32 px-6 border-t border-white/5 bg-black/60 text-center">
                                <h2 className="text-6xl md:text-9xl font-heading font-black uppercase italic tracking-tighter mb-16 opacity-90 text-white">Let's Connect.</h2>
                                <div className="flex justify-center gap-12 mb-20 text-white">
                                    <a href="https://www.instagram.com/faldangg.aep/" target="_blank" className="hover:text-purple-400 transition-all transform hover:-translate-y-2 duration-300">
                                        <Icon name="instagram" size={40} />
                                    </a>
                                    <a href="https://www.tiktok.com/@fadlaniskandarpro" target="_blank" className="hover:text-purple-400 transition-all transform hover:-translate-y-2 duration-300 flex items-center"><TikTokIcon size={40} /></a>
                                </div>
                                <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6 font-mono text-[9px] uppercase font-bold tracking-[0.4em] opacity-20">
                                    <span>© 2026 MUHAMMAD FADLAN ISKANDAR</span>
                                    <div className="flex gap-8"><span>UTC+7 DEPOK</span><span>{whatsappNumber}</span></div>
                                </div>
                            </footer>
                        </div>
                    ) : (
                        <div className="pt-40 px-6 pb-32 animate-fade-in text-center max-w-7xl mx-auto text-white relative z-10">
                            <h2 className="text-7xl md:text-9xl font-heading uppercase italic tracking-tighter mb-6 glow-text">PRICE LIST.</h2>
                            <p className="text-white/40 font-bold uppercase tracking-widest text-[10px] mb-20">CHOOSE THE BEST PROFESSIONAL VISUAL PACKAGE FOR YOUR NEEDS.</p>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-8 mb-40 text-left">
                                {pricingPlans.map(plan => (
                                    <div key={plan.title} className={`p-10 border relative overflow-hidden transition-all duration-500 hover:-translate-y-2 ${plan.popular ? 'border-purple-600 bg-[#0c0c0c]/80 scale-105 z-10 premium-glow' : 'border-white/5 bg-white/5 opacity-80 hover:opacity-100 hover:border-white/20'}`}>
                                        {plan.popular && <div className="absolute top-0 right-0 bg-purple-600 text-white text-[9px] font-bold px-4 py-1 uppercase tracking-widest">BEST SELLER</div>}
                                        <h3 className="text-3xl font-heading uppercase italic mb-2 tracking-tighter">{plan.title}</h3>
                                        <div className="text-4xl font-bold text-purple-600 mb-10 tracking-tighter">{plan.price}<span className="text-xs text-white/30 font-bold ml-2">/ MIN</span></div>
                                        <div className="space-y-4 mb-12">
                                            {plan.features.map(f => (
                                                <div key={f} className="flex items-center gap-3 text-[10px] font-bold uppercase tracking-widest text-white/70"><Icon name="check" size={14} color="#a855f7" strokeWidth={4} /> {f}</div>
                                            ))}
                                        </div>
                                        <button onClick={() => window.open(`https://wa.me/${whatsappNumber}?text=Hi Fadlan, I want to book the ${plan.title} package.`)} className="w-full bg-purple-600 hover:bg-purple-500 py-5 font-bold uppercase text-[11px] tracking-widest transition-all duration-300 transform hover:scale-[1.02]">BOOK NOW</button>
                                    </div>
                                ))}
                            </div>

                            <div className="max-w-3xl mx-auto mt-40 text-left">
                                <div className="text-center mb-16">
                                   <p className="font-heading text-purple-500 text-xs uppercase tracking-[0.4em] mb-4">INVESTMENT GUIDE</p>
                                   <h2 className="text-5xl md:text-6xl font-heading uppercase italic tracking-tighter">FAQ.</h2>
                                </div>
                                <div className="space-y-4">
                                  {faqs.map((faq, index) => (
                                    <div key={index} className="rounded-sm border border-white/5 bg-black/40 backdrop-blur-md overflow-hidden transition-all duration-300 shadow-lg">
                                      <button onClick={() => setActiveFaq(activeFaq === index ? null : index)} className="w-full px-8 py-6 flex items-center justify-between text-left group">
                                        <span className="font-heading italic uppercase tracking-widest text-sm text-white/80 group-hover:text-white transition-colors duration-300">{faq.q}</span>
                                        <Icon name="chevron-down" className={`transition-transform duration-500 text-purple-500 ${activeFaq === index ? 'rotate-180' : ''}`} />
                                      </button>
                                      {activeFaq === index && (
                                        <div className="px-8 pb-8 text-white/50 text-sm leading-relaxed font-medium animate-fade-in">{faq.a}</div>
                                      )}
                                    </div>
                                  ))}
                                </div>
                            </div>
                            <footer className="mt-40 pt-20 border-t border-white/5 opacity-20 font-mono text-[9px] uppercase tracking-[0.4em]">© 2026 MUHAMMAD FADLAN ISKANDAR — DEPOK</footer>
                        </div>
                    )}

                    {/* MODAL VIDEO */}
                    {selectedVideo && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 md:p-10 bg-black/95 backdrop-blur-2xl animate-fade-in" onClick={() => setSelectedVideo(null)}>
                            <div className="relative w-full max-w-5xl bg-[#0a0a0a] border border-white/10 shadow-3xl overflow-hidden rounded-sm" onClick={e => e.stopPropagation()}>
                                <button className="absolute top-6 right-6 text-white hover:text-purple-500 z-50 transition-colors" onClick={() => setSelectedVideo(null)}><Icon name="x" size={30} /></button>
                                <div className="aspect-video bg-black">
                                    <iframe src={selectedVideo.videoUrl} className="w-full h-full border-0" allowFullScreen></iframe>
                                </div>
                                <div className="p-10 text-left">
                                    <span className="text-[10px] font-bold uppercase tracking-widest text-purple-500 mb-2 block">{selectedVideo.category}</span>
                                    <h2 className="text-3xl md:text-5xl font-heading uppercase italic tracking-tighter mb-4">{selectedVideo.title}</h2>
                                    <p className="text-white/50 text-lg font-medium leading-relaxed max-w-3xl border-l-2 border-purple-600 pl-6 text-justify">{selectedVideo.desc}</p>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
