                                <a href={"https://wa.me/" + whatsappNumber} target="_blank" className="bg-purple-600 text-white px-5 py-2.5 rounded-sm text-[10px] font-bold uppercase tracking-widest hover:bg-purple-500 transition-all shadow-lg">WhatsApp</a>
                            </div>
                        </div>
                    </nav>

                    {currentPage === 'portfolio' ? (
                        <div className="animate-fade-in text-left">
                            
                            {/* HERO SECTION */}
                            <section id="hero" className="min-h-screen flex items-center justify-center pt-20 px-6 text-center relative overflow-hidden">
                                <div className="absolute inset-10 pointer-events-none opacity-30 z-0">
                                    <div className="vf-corner top-0 left-0 border-t-2 border-l-2 border-white/20"></div>
                                    <div className="vf-corner top-0 right-0 border-t-2 border-r-2 border-white/20"></div>
                                    <div className="vf-corner bottom-0 left-0 border-b-2 border-l-2 border-white/20"></div>
                                    <div className="vf-corner bottom-0 right-0 border-b-2 border-r-2 border-white/20"></div>
                                </div>

                                <div className="relative z-10 max-w-5xl mx-auto flex flex-col items-center">
                                    {/* HERO BADGE */}
                                    <div className="inline-flex items-center gap-3 px-5 py-2 rounded-full border border-white/10 bg-white/5 text-purple-400 mb-8 shadow-md">
                                        <div className="w-2 h-2 rounded-full bg-red-600 animate-pulse"></div>
                                        <span className="text-[9px] uppercase font-black tracking-[0.2em]">• FROM RAW TO WOW</span>
                                    </div>

                                    <h1 className="text-[14vw] sm:text-[10vw] font-heading leading-[0.82] uppercase mb-8 italic drop-shadow-2xl glow-text-dark text-white">
                                        FADLAN <span className="text-transparent bg-clip-text bg-gradient-to-r from-purple-500 to-purple-800">ISKANDAR.</span>
                                    </h1>
                                    <p className="max-w-xl mx-auto text-xs md:text-sm font-bold uppercase tracking-widest mb-12 leading-relaxed text-center text-white/40">
                                        Transforming ideas into visual masterpieces through high-end motion design and cinematic editing.
                                    </p>
                                    <div className="flex flex-col sm:flex-row justify-center gap-4 mb-20 text-center">
                                        <a href="#work" className="bg-purple-600 hover:bg-purple-500 text-white px-8 py-3.5 rounded-sm font-black uppercase text-[10px] tracking-widest transition-all shadow-xl">Explore Works</a>
                                        <button onClick={() => setCurrentPage('prices')} className="border border-white/10 bg-white/5 hover:bg-white/10 text-white px-8 py-3.5 rounded-sm font-black uppercase text-[10px] tracking-widest transition-all">Price List</button>
                                    </div>
                                </div>
                            </section>

                            <div className="py-3.5 overflow-hidden border-y border-black bg-white text-black relative z-20 flex">
                                <div className="animate-marquee flex items-center">
                                    <span className="font-heading uppercase italic tracking-tighter text-lg sm:text-2xl mx-4">VIDEO EDITING • MOTION GRAPHICS • VISUAL EFFECTS • 2D ANIMATION • COLOR GRADING • CINEMATIC STORYTELLING •</span>
                                </div>
                                <div className="animate-marquee flex items-center">
                                    <span className="font-heading uppercase italic tracking-tighter text-lg sm:text-2xl mx-4">VIDEO EDITING • MOTION GRAPHICS • VISUAL EFFECTS • 2D ANIMATION • COLOR GRADING • CINEMATIC STORYTELLING •</span>
                                </div>
                            </div>

                            {}
                            {/* TRUSTED LOGO CLIENTS DECK */}
                            <section className="py-20 border-b border-white/5 bg-[#070707]/60">
                                <div className="max-w-7xl mx-auto px-6">
                                    <p className="font-mono text-[9px] tracking-[0.4em] uppercase text-center mb-12 text-white/30">TRUSTED BY INDUSTRY PARTNERS</p>
                                    <div className="grid grid-cols-2 sm:grid-cols-5 md:grid-cols-10 gap-6 items-center justify-items-center">
                                        {clientLogos.map((logo, index) => (
                                            <div key={index} className="w-16 h-16 md:w-20 md:h-20 rounded-2xl overflow-hidden border border-white/5 bg-[#0a0a0a] hover:border-purple-600/40 flex items-center justify-center p-3 transition-all duration-300 opacity-60 hover:opacity-100 hover:scale-105">
                                                <img src={logo} alt="Client Brand" className="w-full h-full object-contain" />
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </section>

                            {/* ABOUT ME SECTION */}
                            <section id="about" className="py-32 px-6 text-center bg-black/40">
                                <div className="max-w-4xl mx-auto">
                                    <div className="flex items-center justify-center gap-4 mb-10">
                                        <div className="w-2 h-8 bg-purple-600"></div>
                                        <h2 className="text-4xl md:text-6xl font-heading uppercase italic tracking-tighter">About Me.</h2>
                                        <div className="w-2 h-8 bg-purple-600"></div>
                                    </div>
                                    <p className="text-lg md:text-2xl font-medium leading-relaxed mb-16 text-center text-white/70">
                                        I am Muhammad Fadlan Iskandar, a <span className="font-black italic text-white">Video Editor & Motion Designer</span> based in Indonesia. Since 2023, I have dedicated myself to transforming every piece of raw footage into a visual masterpiece with a definitive Wow factor.
                                    </p>
                                    
                                    {/* GRID SKILLS */}
                                    <div className="grid grid-cols-2 md:grid-cols-6 gap-4">
                                        {[
                                            {n: <LayersIcon size={20} />, l:'AE'}, {n: <ClapperboardIcon size={20} />, l:'PR'}, 
                                            {n: <LayoutIcon size={20} />, l:'AI'}, {n: <TvIcon size={20} />, l:'PS'}, 
                                            {n: <ZapIcon size={20} />, l:'VFX'}, {n: <CameraIcon size={20} />, l:'CINEMA'}
                                        ].map((item, idx) => (
                                            <div key={idx} className="border border-white/5 bg-[#0b0b0b] hover:border-purple-600/50 hover:bg-purple-600/5 p-6 rounded-xl flex flex-col items-center gap-3 group transition-all">
                                                <span className="text-purple-600 group-hover:scale-110 transition-transform">{item.n}</span>
                                                <span className="text-[11px] font-bold uppercase tracking-widest text-white/50">{item.l}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </section>

                            {}
                            {/* WORK ARCHIVE SECTION */}
                            <section id="work" className="py-32 px-6 border-t border-white/5">
                                <div className="max-w-7xl mx-auto">
                                    <div className="flex flex-col md:flex-row md:items-end justify-between mb-12 gap-6">
                                        <div>
                                            <span className="font-mono text-[9px] text-purple-500 uppercase tracking-[0.4em] block mb-2">CURATED ARCHIVE</span>
                                            <h2 className="text-5xl md:text-7xl font-heading uppercase italic tracking-tighter">Selected Works.</h2>
                                        </div>

                                        {/* FILTER LEVEL 1 */}
                                        <div className="flex flex-wrap gap-2 p-1 rounded-sm bg-white/5 border border-white/5">
                                            {['All', 'Video Editing', 'Animasi'].map(c => (
                                                <button 
                                                    key={c} 
                                                    onClick={() => handleCategoryChange(c)} 
                                                    className={"text-[10px] font-bold uppercase tracking-widest px-6 py-2 transition-all rounded-sm " + (activeCategory === c ? "bg-purple-600 text-white shadow-lg" : "hover:bg-white/10 text-white/40")}
                                                >
                                                    {c}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* FILTER LEVEL 2 */}
                                    {activeCategory !== 'All' && (
                                        <div className="flex flex-wrap gap-2 mb-12 p-1 border border-white/5 rounded-lg max-w-max animate-fade-in bg-[#0b0b0b]">
                                            <button 
                                                onClick={() => setActiveSubCategory('All')} 
                                                className={"text-[9px] font-bold uppercase tracking-wider px-4 py-1.5 rounded-md transition-all " + (activeSubCategory === 'All' ? "bg-white/10 text-white" : "text-slate-400 hover:text-purple-600")}
                                            >
                                                Show All
                                            </button>
                                            {activeCategory === 'Video Editing' && (
                                                <React.Fragment>
                                                    <button 
                                                        onClick={() => setActiveSubCategory('Talking Head')} 
                                                        className={"text-[9px] font-bold uppercase tracking-wider px-4 py-1.5 rounded-md transition-all " + (activeSubCategory === 'Talking Head' ? "bg-purple-600/20 border border-purple-500/30 text-purple-400 font-extrabold" : "text-slate-400 hover:text-purple-600")}
                                                    >
                                                        Talking Head
                                                    </button>
                                                    <button 
                                                        onClick={() => setActiveSubCategory('VFX')} 
                                                        className={"text-[9px] font-bold uppercase tracking-wider px-4 py-1.5 rounded-md transition-all " + (activeSubCategory === 'VFX' ? "bg-purple-600/20 border border-purple-500/30 text-purple-400 font-extrabold" : "text-slate-400 hover:text-purple-600")}
                                                    >
                                                        VFX
                                                    </button>
                                                </React.Fragment>
                                            )}
                                            {activeCategory === 'Animasi' && (
                                                <React.Fragment>
                                                    <button 
                                                        onClick={() => setActiveSubCategory('Motion Graphics')} 
                                                        className={"text-[9px] font-bold uppercase tracking-wider px-4 py-1.5 rounded-md transition-all " + (activeSubCategory === 'Motion Graphics' ? "bg-purple-600/20 border border-purple-500/30 text-purple-400 font-extrabold" : "text-slate-400 hover:text-purple-600")}
                                                    >
                                                        Motion Graphics
                                                    </button>
                                                </React.Fragment>
                                            )}
                                        </div>
                                    )}

                                    {/* GRID OUTPUT */}
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                                        {filteredProjects.map(p => (
                                            <div key={p.id} className="group relative aspect-square border rounded-sm overflow-hidden cursor-pointer shadow-xl text-left bg-[#0a0a0a] border-white/5" onClick={() => setSelectedVideo(p)}>
                                                <div className={"absolute inset-0 z-0 bg-gradient-to-br transition-all duration-500 opacity-60 group-hover:opacity-100 " + (p.category === 'Video Editing' ? 'from-blue-600/40' : 'from-purple-600/40') + " to-black"}></div>
                                                <div className="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all duration-300 scale-75 group-hover:scale-100">
                                                    <div className="bg-white text-black p-4 rounded-full shadow-2xl">
                                                        <PlayIcon size={30} fill="black" className="text-black ml-0.5" />
                                                    </div>
                                                </div>
                                                <div className="absolute bottom-8 left-8 text-left text-white">
                                                    <div className="flex items-center gap-2 mb-2">
                                                        <div className={"w-1.5 h-1.5 rounded-full " + (p.category === 'Video Editing' ? 'bg-blue-500' : 'bg-purple-500')}></div>
                                                        <span className="text-[9px] uppercase font-bold text-white/60 tracking-[0.2em]">{p.subCategory}</span>
                                                    </div>
                                                    <h3 className="text-xl font-heading uppercase italic tracking-tight">{p.title}</h3>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </section>

                            <footer className="py-32 px-6 border-t text-center border-white/5 bg-black/60 text-white">
                                <h2 className="text-6xl md:text-9xl font-heading font-black uppercase italic tracking-tighter mb-16 opacity-90 flex justify-center">Let's Connect.</h2>
                                <div className="flex justify-center gap-12 mb-20">
                                    <a href="https://www.instagram.com/faldangg.aep/" target="_blank" className="hover:text-purple-500 transition-all transform hover:-translate-y-2">
                                        <InstagramIcon size={40} />
                                    </a>
                                    <a href="https://www.tiktok.com/@fadlaniskandarpro" target="_blank" className="hover:text-purple-500 transition-all transform hover:-translate-y-2 flex items-center"><TikTokIcon size={40} /></a>
                                </div>
                                <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6 font-mono text-[9px] uppercase font-bold tracking-[0.4em] opacity-30">
                                    <span>© 2026 MUHAMMAD FADLAN ISKANDAR</span>
                                    <div className="flex gap-8"><span>UTC+7 DEPOK</span><span>{whatsappNumber}</span></div>
                                </div>
                            </footer>
                        </div>
                    ) : (
                        /* PRICES PAGE */
                        <div className="pt-40 px-6 pb-32 animate-fade-in text-center max-w-7xl mx-auto">
                            <h2 className="text-7xl md:text-9xl font-heading uppercase italic tracking-tighter mb-6 text-center glow-text-dark text-white">PRICE LIST.</h2>
                            <p className="font-bold uppercase tracking-widest text-[10px] mb-20 text-center text-white/40">Choose the best professional visual package for your needs.</p>
                            
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-8 mb-40 text-left">
                                {pricingPlans.map(plan => (
                                    <div key={plan.title} className={"p-10 border relative overflow-hidden transition-all duration-300 rounded-sm " + (plan.popular ? "border-purple-600 bg-purple-900/10 shadow-2xl scale-105 z-10" : "border-white/5 bg-white/5 opacity-80")}>
                                        {plan.popular && <div className="absolute top-0 right-0 bg-purple-600 text-white text-[9px] font-bold px-4 py-1 uppercase tracking-widest">BEST SELLER</div>}
                                        <h3 className="text-3xl font-heading uppercase italic mb-2 tracking-tighter">{plan.title}</h3>
                                        <div className="text-4xl font-bold text-purple-600 mb-10 tracking-tighter">{plan.price}<span className="text-xs opacity-40 font-bold ml-2">/ MIN</span></div>
                                        <div className="space-y-4 mb-12">
                                            {plan.features.map(f => (
                                                <div key={f} className="flex items-center gap-3 text-[10px] font-bold uppercase tracking-widest opacity-80"><CheckIcon size={14} color="#a855f7" /> {f}</div>
                                            ))}
                                        </div>
                                        <button onClick={() => window.open("https://wa.me/" + whatsappNumber + "?text=Hi Fadlan, I want to book the " + plan.title + " package.")} className="w-full bg-purple-600 hover:bg-purple-500 py-5 font-bold uppercase text-[11px] tracking-widest transition-all text-white text-center">Book Now</button>
                                    </div>
                                ))}
                            </div>

                            {/* FAQ */}
                            <div className="max-w-3xl mx-auto mt-40 text-left">
                                <div className="text-center mb-16">
                                   <p className="font-heading text-purple-600 text-xs uppercase tracking-[0.4em] mb-4 text-center">INVESTMENT GUIDE</p>
                                   <h2 className="text-5xl md:text-6xl font-heading uppercase italic tracking-tighter text-center">FAQ.</h2>
                                </div>
                                <div className="space-y-4 text-left">
                                  {faqs.map((faq, index) => (
                                    <div key={index} className="rounded-sm border border-white/5 bg-black/40 overflow-hidden transition-all shadow-sm">
                                      <button onClick={() => setActiveFaq(activeFaq === index ? null : index)} className="w-full px-8 py-6 flex items-center justify-between text-left group">
                                        <span className="font-heading italic uppercase tracking-widest text-sm opacity-80 group-hover:opacity-100 transition-colors">{faq.q}</span>
                                        <ChevronDownIcon size={18} className={"transition-transform duration-300 text-purple-600 " + (activeFaq === index ? "rotate-180" : "")} />
                                      </button>
                                      {activeFaq === index && (
                                        <div className="px-8 pb-8 opacity-60 text-sm leading-relaxed font-medium animate-fade-in text-left">{faq.a}</div>
                                      )}
                                    </div>
                                  ))}
                                </div>
                            </div>
                            <footer className="mt-40 pt-20 border-t border-white/5 opacity-30 font-mono text-[9px] uppercase tracking-[0.4em]">© 2026 MUHAMMAD FADLAN ISKANDAR — DEPOK</footer>
                        </div>
                    )}

                    {}
                    {/* LIVE POPUP NOTIFICATION (PRICES PAGE ONLY) */}
                    {currentPage === 'prices' && activeNotification && (
                        <div className="fixed bottom-6 left-6 z-[150] bg-black/95 border border-purple-500/30 p-4 rounded-lg shadow-[0_10px_50px_rgba(168,85,247,0.25)] flex items-center gap-4 animate-slide-in-up max-w-sm backdrop-blur-md text-white">
                            <div className="w-10 h-10 rounded-full bg-purple-600/20 border border-purple-500/50 flex items-center justify-center shrink-0">
                                <ShoppingBagIcon size={18} className="text-purple-400 animate-pulse" />
                            </div>
                            <div className="text-left">
                                <p className="text-[9px] text-white/40 font-mono uppercase tracking-wider">Client Review</p>
                                <p className="text-xs font-bold text-white">
                                    <span className="text-purple-400">{activeNotification.name}</span> dari <span className="text-purple-300">{activeNotification.city}</span>
                                </p>
                                <div className="flex gap-0.5 my-1">
                                    {[...Array(5)].map((_, i) => (
                                        <span key={i} className="text-amber-400 text-[10px]">★</span>
                                    ))}
                                </div>
                                <p className="text-[11px] text-white/70 italic leading-relaxed">
                                    "{activeNotification.review}"
                                </p>
                            </div>
                        </div>
                    )}

                    {/* MODAL VIDEO PLAYBACK */}
                    {selectedVideo && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 md:p-10 bg-black/95 backdrop-blur-md animate-fade-in text-white text-left" onClick={() => setSelectedVideo(null)}>
                            <div className="relative w-full max-w-5xl bg-[#0a0a0a] border border-white/10 shadow-3xl overflow-hidden rounded-sm text-white" onClick={e => e.stopPropagation()}>
                                <button className="absolute top-6 right-6 text-white hover:text-purple-500 z-50 transition-colors" onClick={() => setSelectedVideo(null)}><XIcon size={30} /></button>
                                <div className="aspect-video bg-black flex items-center justify-center">
                                    {selectedVideo.videoUrl.includes('raw=1') ? (
                                        <video 
                                            src={selectedVideo.videoUrl} 
                                            className="w-full h-full object-contain animate-fade-in" 
                                            controls 
                                            autoPlay
                                        />
                                    ) : (
                                        <iframe src={selectedVideo.videoUrl} className="w-full h-full border-0 text-white" allowFullScreen></iframe>
                                    )}
                                </div>
                                <div className="p-10 text-left text-white">
                                    <span className="text-[10px] font-bold uppercase tracking-widest text-purple-400 mb-2 block">{selectedVideo.category}</span>
                                    <h2 className="text-3xl md:text-5xl font-heading uppercase italic tracking-tighter mb-4 text-white">{selectedVideo.title}</h2>
                                    <p className="text-white/50 text-lg font-medium leading-relaxed max-w-3xl border-l-2 border-purple-600 pl-6 text-justify">{selectedVideo.desc}</p>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
