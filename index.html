<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faldangg.aep | Portfolio & Price List</title>
    
    <!-- Library Inti (Stable CDN) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Fonts: Archivo (Bold & Compact) & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,700;0,900;1,700;1,900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              archivo: ['Archivo', 'sans-serif'],
              sans: ['Inter', 'sans-serif'],
            },
          },
        },
      }
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: white; margin: 0; overflow-x: hidden; }
        .font-heading { font-family: 'Archivo', sans-serif; font-weight: 900; letter-spacing: -0.04em; }

        /* MOVING GRID BACKGROUND (Opacity 30%) */
        .moving-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: 50px 50px;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            z-index: -1;
            opacity: 0.3;
            animation: grid-scroll 20s linear infinite;
            pointer-events: none;
        }

        @keyframes grid-scroll {
            from { background-position: 0 0; }
            to { background-position: 50px 50px; }
        }

        .grain-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("https://www.transparenttextures.com/patterns/carbon-fibre.png");
            opacity: 0.02; pointer-events: none; z-index: 0;
        }

        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }
        .animate-marquee {
            display: inline-block;
            white-space: nowrap;
            animation: marquee 30s linear infinite;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.6s ease-out forwards; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #6b21a8; border-radius: 10px; }

        .vf-corner { position: absolute; width: 30px; height: 30px; border-color: rgba(255,255,255,0.2); pointer-events: none; border-style: solid; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- SAFE ICON COMPONENT ---
        const Icon = ({ name, size = 20, color = "currentColor", strokeWidth = 2, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size, color: color, strokeWidth: strokeWidth }}></i>;
        };

        const TikTokIcon = ({ className, size = 20 }) => (
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} style={{ width: size, height: size }}>
                <path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5" />
            </svg>
        );

        const App = () => {
            const [currentPage, setCurrentPage] = useState('portfolio');
            const [selectedVideo, setSelectedVideo] = useState(null);
            const [activeFilter, setActiveFilter] = useState('All');
            const [isScrolled, setIsScrolled] = useState(false);
            const [currentTime, setCurrentTime] = useState(new Date());
            const [scrollProgress, setScrollProgress] = useState(0);
            const [activeFaq, setActiveFaq] = useState(null);

            const whatsappNumber = "6287713907028";
            const profilePhoto = "https://drive.google.com/thumbnail?id=1dRhprhx18WX_HJgfa9zU5WGbqCWSW2Ko&sz=w1000";
            const categories = ['All', 'Video Editing', 'Motion Graphics', 'Others'];

            const projects = [
                { id: 1, title: "Social Media Storytelling", category: "Video Editing", videoUrl: "https://drive.google.com/file/d/19gjVMRb8YBiWmyKqLD0QvE1Asf_aAV8v/preview", desc: "Professional storytelling for social media growth." },
                { id: 2, title: "Marketing Strategy", category: "Video Editing", videoUrl: "https://drive.google.com/file/d/1uHtsGTRCZMU7dnrcmZU-QFXNtVKQvn87/preview", desc: "High-conversion marketing video for agencies." },
                { id: 3, title: "Short Clips Edition", category: "Video Editing", videoUrl: "https://drive.google.com/file/d/1NEHJhGfpC-sSgerLr7IHKuvrdiaFrp/preview", desc: "Dynamic short clip editing for viral reach." },
                { id: 4, title: "Education Series", category: "Video Editing", videoUrl: "https://drive.google.com/file/d/1NADGk2fXcYkjlwqctPfwRtso37B2HrGt/preview", desc: "Clear and engaging educational video production." },
                { id: 6, title: "Name Animation AI", category: "Motion Graphics", videoUrl: "https://drive.google.com/file/d/1J2NQf5ihoyj2TyB2AvyTWq4aj36nFGjs/preview", desc: "Innovative typography using AI motion tools." },
                { id: 7, title: "Chess Motion Graphic", category: "Motion Graphics", videoUrl: "https://drive.google.com/file/d/1RX_jaAZEwnDMyt-mIKQSjYnX6_IsjVkJ/preview", desc: "Sleek 2D animation for game intros." },
                { id: 8, title: "Stream Overlay Design", category: "Motion Graphics", videoUrl: "https://drive.google.com/file/d/1xgV2RXS0hSGP1Dfej8M68w84nH9yJd2W/preview", desc: "Custom overlays for high-end streamers." },
                { id: 9, title: "Messi Smart Brain", category: "Motion Graphics", videoUrl: "https://drive.google.com/file/d/1JMDnrv3YSL-0kJImd_Ad_oBTa1a7gKbo/preview", desc: "Technical breakdown animation." },
                { id: 10, title: "Wedding Invitations", category: "Motion Graphics", videoUrl: "https://drive.google.com/file/d/1t_7pS0vVxNsRiir_7rDVnmGPUs49lG4A/preview", desc: "Cinematic digital wedding invitations." },
                { id: 11, title: "VFX Disappear Dunk", category: "Others", videoUrl: "https://drive.google.com/file/d/17I58XTHkoQ1EmylnVKKHFxX3n4ogC9RC/preview", desc: "Complex VFX integration in sports content." },
                { id: 12, title: "Split Ball VFX", category: "Others", videoUrl: "https://drive.google.com/file/d/1bAwEDHVYzMhEwYrOO5LUdbsUfOVF8lVQ/preview", desc: "Visual effects for basketball highlights." },
                { id: 13, title: "Color Grading Power", category: "Others", videoUrl: "https://drive.google.com/file/d/17nj_Cfub9kc9T7Iqm92ptaFmJh-vVSFY/preview", desc: "Transforming raw footage with cinematic grading." },
                { id: 14, title: "Short Movie Trailer", category: "Others", videoUrl: "https://drive.google.com/file/d/18UtGI0K4x77KGJOdmqUuDPvrlOok5blS/preview", desc: "Dramatic trailer for independent animation projects." },
            ];

            const pricingPlans = [
                { title: "BASIC", price: "Rp 119k", features: ["Text Typography", "Cutting & Pacing", "Sound Effects", "Basic Motion", "9:16 Vertical", "2x Revisions"] },
                { title: "PREMIUM", price: "Rp 169k", popular: true, features: ["Text Typography", "Pro Cutting", "Sound & Music", "Advanced Motion", "Color Grading", "3x Revisions"] },
                { title: "BUSINESS", price: "Rp 249k", features: ["VFX Integration", "Advanced SFX", "Custom Motion", "Cinematic Grading", "Custom Resolution", "3x Revisions"] }
            ];

            const faqs = [
                { q: "How long is the process?", a: "Processing usually takes 2-3 working days depending on complexity." },
                { q: "How to send raw files?", a: "You can send files via Google Drive or Telegram for the best quality." },
                { q: "Are revisions included?", a: "Yes, each package includes minor revisions as described in the plan." }
            ];

            useEffect(() => {
                const handleScroll = () => {
                    setIsScrolled(window.scrollY > 50);
                    const winScroll = document.documentElement.scrollTop;
                    const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                    setScrollProgress((winScroll / height) * 100);
                };
                const timer = setInterval(() => setCurrentTime(new Date()), 1000);
                window.addEventListener('scroll', handleScroll);
                if (window.lucide) window.lucide.createIcons();
                return () => { window.removeEventListener('scroll', handleScroll); clearInterval(timer); };
            }, []);

            const filteredProjects = activeFilter === 'All' ? projects : projects.filter(p => p.category === activeFilter);

            return (
                <div className="relative min-h-screen">
                    <div className="moving-grid"></div>
                    <div className="grain-overlay"></div>
                    
                    <div className="fixed top-0 left-0 h-1 bg-purple-600 z-[100] transition-all duration-150" style={{ width: `${scrollProgress}%` }}></div>

                    {/* NAVBAR */}
                    <nav className={`fixed top-0 w-full z-[80] transition-all duration-300 ${isScrolled ? 'bg-black/90 backdrop-blur-md py-4 border-b border-white/5' : 'bg-transparent py-8'}`}>
                        <div className="max-w-7xl mx-auto px-6 flex justify-between items-center text-white">
                            <div className="flex items-center gap-4 cursor-pointer" onClick={() => setCurrentPage('portfolio')}>
                                <div className="w-10 h-10 bg-purple-600 flex items-center justify-center rounded-lg shadow-lg">
                                    <Icon name="monitor" size={20} color="white" />
                                </div>
                                <div className="hidden sm:block text-left">
                                    <span className="text-lg font-heading block leading-none uppercase">FALDANGG<span className="text-purple-500">.AEP</span></span>
                                    <span className="text-[8px] opacity-40 uppercase tracking-widest font-bold">Video Editor & Motion Graphics Designer</span>
                                </div>
                            </div>
                            <div className="flex items-center gap-6">
                                {currentPage === 'portfolio' ? (
                                    <div className="hidden md:flex gap-8 text-[10px] uppercase font-bold text-white/50">
                                        <a href="#hero" className="hover:text-purple-500 transition-colors">Home</a>
                                        <a href="#about" className="hover:text-purple-500 transition-colors">About</a>
                                        <a href="#work" className="hover:text-purple-500 transition-colors">Works</a>
                                        <button onClick={() => setCurrentPage('prices')} className="hover:text-purple-500 transition-colors font-bold text-white">Price List</button>
                                    </div>
                                ) : (
                                    <button onClick={() => setCurrentPage('portfolio')} className="text-[10px] font-bold uppercase tracking-widest text-white/50 hover:text-white flex items-center gap-2">
                                        <Icon name="arrow-left" size={14} /> Back
                                    </button>
                                )}
                                <a href={`https://wa.me/${whatsappNumber}`} className="bg-white text-black px-5 py-2 rounded-sm text-[10px] font-bold uppercase tracking-widest hover:bg-green-500 hover:text-white transition-all shadow-xl">WhatsApp</a>
                            </div>
                        </div>
                    </nav>

                    {currentPage === 'portfolio' ? (
                        <div className="animate-fade-in text-white">
                            {/* HERO SECTION */}
                            <section id="hero" className="min-h-screen flex items-center justify-center pt-20 px-6 text-center relative overflow-hidden">
                                <div className="absolute inset-10 pointer-events-none opacity-40 z-0">
                                    <div className="vf-corner top-0 left-0 border-t-2 border-l-2"></div>
                                    <div className="vf-corner top-0 right-0 border-t-2 border-r-2"></div>
                                    <div className="vf-corner bottom-0 left-0 border-b-2 border-l-2"></div>
                                    <div className="vf-corner bottom-0 right-0 border-b-2 border-r-2"></div>
                                </div>

                                <div className="relative z-10 max-w-5xl mx-auto flex flex-col items-center">
                                    {/* COMPACT BADGE AT CENTER */}
                                    <div className="inline-flex items-center gap-3 px-5 py-2 rounded-full border border-white/10 bg-white/5 backdrop-blur-md mb-8 shadow-xl">
                                        <div className="flex items-center gap-2">
                                            <div className="w-1.5 h-1.5 rounded-full bg-red-600 animate-pulse"></div>
                                            <span className="text-[9px] font-bold text-white/80 font-mono tracking-tight">{currentTime.toLocaleTimeString('en-GB')}</span>
                                        </div>
                                        <span className="text-[9px] uppercase font-black tracking-[0.2em] text-purple-400">• FROM RAW TO WOW</span>
                                    </div>

                                    <h1 className="text-[14vw] sm:text-[10vw] font-heading leading-[0.82] uppercase mb-8 italic drop-shadow-2xl">
                                        FADLAN <span className="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-white">ISKANDAR.</span>
                                    </h1>
                                    <p className="max-w-xl mx-auto text-white/40 text-xs md:text-sm font-bold uppercase tracking-widest mb-12 leading-relaxed">Transforming ideas into visual masterpieces through high-end motion design and cinematic editing.</p>
                                    <div className="flex flex-col sm:flex-row justify-center gap-4 mb-20">
                                        <a href="#work" className="bg-purple-600 hover:bg-purple-500 text-white px-8 py-3 rounded-sm font-black uppercase text-[10px] tracking-widest transition-all shadow-xl">Explore Works</a>
                                        <button onClick={() => setCurrentPage('prices')} className="bg-white/5 border border-white/10 hover:bg-white/10 px-8 py-3 rounded-sm font-black uppercase text-[10px] tracking-widest transition-all">Price List</button>
                                    </div>
                                </div>
                            </section>

                            {/* MARQUEE */}
                            <div className="bg-white text-black py-3 overflow-hidden border-y border-black relative z-20 flex">
                                <div className="animate-marquee flex items-center">
                                    <span className="font-heading uppercase italic tracking-tighter text-lg sm:text-2xl mx-4">VIDEO EDITING • MOTION GRAPHICS • VISUAL EFFECTS • 2D ANIMATION • COLOR GRADING • CINEMATIC STORYTELLING •</span>
                                </div>
                                <div className="animate-marquee flex items-center">
                                    <span className="font-heading uppercase italic tracking-tighter text-lg sm:text-2xl mx-4">VIDEO EDITING • MOTION GRAPHICS • VISUAL EFFECTS • 2D ANIMATION • COLOR GRADING • CINEMATIC STORYTELLING •</span>
                                </div>
                            </div>

                            {/* ABOUT SECTION */}
                            <section id="about" className="py-32 px-6 bg-black/40 backdrop-blur-sm">
                                <div className="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-20 items-center">
                                    <div className="text-left">
                                        <div className="flex justify-between items-center mb-10 border-b border-white/5 pb-6">
                                            <div className="flex items-center gap-4 text-white">
                                                <div className="w-2 h-8 bg-purple-600"></div>
                                                <h2 className="text-4xl md:text-6xl font-heading uppercase italic tracking-tighter">About Me.</h2>
                                            </div>
                                        </div>
                                        <p className="text-white/70 text-lg md:text-xl font-medium leading-relaxed mb-10 text-justify">
                                            I am Muhammad Fadlan Iskandar, a Video Editor & Motion Graphics Designer based in Indonesia. Since 2023, I have dedicated myself to transforming every piece of Raw footage into a visual masterpiece with a definitive Wow factor.
                                        </p>
                                        <div className="grid grid-cols-2 sm:grid-cols-3 gap-4">
                                            {[{n:'layers', l:'After Effects'}, {n:'clapperboard', l:'Premiere Pro'}, {n:'layout', l:'Illustrator'}, {n:'tv', l:'Photoshop'}, {n:'zap', l:'VFX/SFX'}, {n:'camera', l:'Cinematics'}].map((item, idx) => (
                                                <div key={idx} className="bg-white/5 border border-white/5 p-4 text-[10px] font-bold uppercase text-white/50 hover:text-purple-400 hover:border-purple-600/50 transition-all text-center flex flex-col items-center gap-2">
                                                    <Icon name={item.n} size={16} />
                                                    {item.l}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="relative aspect-[4/5] bg-neutral-900 overflow-hidden grayscale hover:grayscale-0 transition-all duration-1000 shadow-2xl rounded-sm">
                                        <img src={profilePhoto} className="w-full h-full object-cover" />
                                        <div className="absolute bottom-0 left-0 w-full h-1/3 bg-gradient-to-t from-black to-transparent opacity-80"></div>
                                        <div className="absolute bottom-6 left-6 text-white text-left">
                                            <p className="text-[10px] font-bold uppercase tracking-widest text-purple-500 mb-1">Creative Lead</p>
                                            <p className="text-2xl font-heading font-black uppercase italic tracking-tight">Fadlan Iskandar</p>
                                        </div>
                                    </div>
                                </div>
                            </section>

                            {/* WORK ARCHIVE */}
                            <section id="work" className="py-32 px-6 border-t border-white/5">
                                <div className="max-w-7xl mx-auto text-white">
                                    <div className="flex flex-col md:flex-row justify-between items-center mb-16 gap-8 text-left">
                                        <h2 className="text-5xl font-heading font-extrabold uppercase italic tracking-tighter">Archive.</h2>
                                        <div className="flex flex-wrap gap-2 p-1 bg-white/5 rounded-sm">
                                            {categories.map(c => (
                                                <button key={c} onClick={() => setActiveFilter(c)} className={`text-[9px] font-bold uppercase tracking-widest px-6 py-2 transition-all ${activeFilter === c ? 'bg-purple-600 text-white shadow-lg' : 'hover:bg-white/10 text-white/40'}`}>{c}</button>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 text-left">
                                        {filteredProjects.map(p => (
                                            <div key={p.id} className="group relative aspect-square bg-[#0a0a0a] border border-white/5 rounded-sm overflow-hidden cursor-pointer shadow-2xl" onClick={() => setSelectedVideo(p)}>
                                                <div className={`absolute inset-0 z-0 bg-gradient-to-br transition-all duration-700 opacity-60 group-hover:opacity-40 ${p.category === 'Video Editing' ? 'from-blue-900/40' : p.category === 'Motion Graphics' ? 'from-purple-900/40' : 'from-emerald-900/40'} to-black`}></div>
                                                <div className="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all duration-500 scale-75 group-hover:scale-100">
                                                    <div className="bg-white text-black p-4 rounded-full shadow-2xl">
                                                        <Icon name="play" size={30} color="black" />
                                                    </div>
                                                </div>
                                                <div className="absolute bottom-8 left-8 text-left">
                                                    <div className="flex items-center gap-2 mb-2">
                                                        <div className={`w-1.5 h-1.5 rounded-full ${p.category === 'Video Editing' ? 'bg-blue-500' : p.category === 'Motion Graphics' ? 'bg-purple-500' : 'bg-emerald-500'}`}></div>
                                                        <span className="text-[9px] uppercase font-bold text-white/40 tracking-[0.2em]">{p.category}</span>
                                                    </div>
                                                    <h3 className="text-xl font-heading italic tracking-tight">{p.title}</h3>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </section>

                            {/* FOOTER */}
                            <footer className="py-32 px-6 border-t border-white/5 bg-black/60 text-center">
                                <h2 className="text-6xl md:text-9xl font-heading uppercase italic tracking-tighter mb-16 opacity-90 text-center">Let's Connect.</h2>
                                <div className="flex justify-center gap-8 mb-20 text-white">
                                    <a href="https://www.instagram.com/faldangg.aep/" target="_blank" className="hover:text-purple-500 transition-all transform hover:-translate-y-2">
                                        <Icon name="instagram" size={40} />
                                    </a>
                                    <a href="https://www.tiktok.com/@fadlaniskandarpro" target="_blank" className="hover:text-purple-500 transition-all transform hover:-translate-y-2 flex items-center">
                                        <TikTokIcon size={40} />
                                    </a>
                                </div>
                                <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6 font-mono text-[9px] uppercase font-bold tracking-[0.4em] opacity-20">
                                    <span>© 2026 MUHAMMAD FADLAN ISKANDAR - PORTOFOLIO & PRICE LIST</span>
                                    <div className="flex gap-8 text-white text-center"><span>UTC+7 DEPOK</span><span>{whatsappNumber}</span></div>
                                </div>
                            </footer>
                        </div>
                    ) : (
                        /* PRICE LIST PAGE */
                        <div className="pt-40 px-6 pb-32 animate-fade-in text-center max-w-7xl mx-auto text-white">
                            <h2 className="text-7xl md:text-9xl font-heading uppercase italic tracking-tighter mb-6 text-center">PRICE LIST.</h2>
                            <p className="text-white/40 font-bold uppercase tracking-widest text-[10px] mb-20 text-center">Choose the best professional visual package for your needs.</p>
                            
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-8 mb-40 text-left">
                                {pricingPlans.map(plan => (
                                    <div key={plan.title} className={`p-10 border relative overflow-hidden transition-all duration-500 ${plan.popular ? 'border-purple-600 bg-[#0c0c0c]/80 shadow-2xl scale-105 z-10' : 'border-white/5 bg-white/5 opacity-80'}`}>
                                        {plan.popular && <div className="absolute top-0 right-0 bg-purple-600 text-white px-4 py-1 text-[9px] font-bold uppercase tracking-widest">BEST SELLER</div>}
                                        <h3 className="text-3xl font-heading uppercase italic mb-2 tracking-tighter">{plan.title}</h3>
                                        <div className="text-4xl font-bold text-purple-500 mb-10 tracking-tighter">{plan.price}<span className="text-xs text-white/30 font-bold ml-2">/ MIN</span></div>
                                        <div className="space-y-4 mb-12">
                                            {plan.features.map(f => (
                                                <div key={f} className="flex items-center gap-3 text-[10px] font-bold uppercase tracking-widest text-white/70"><Icon name="check" size={14} color="#a855f7" strokeWidth={4} /> {f}</div>
                                            ))}
                                        </div>
                                        <button onClick={() => window.open(`https://wa.me/${whatsappNumber}?text=Hi Fadlan, I want to book the ${plan.title} package.`)} className="w-full bg-purple-600 hover:bg-purple-500 py-5 font-bold uppercase text-[11px] tracking-widest transition-all">Book Now</button>
                                    </div>
                                ))}
                            </div>

                            {/* FAQ SECTION */}
                            <div className="max-w-3xl mx-auto mt-40 text-left">
                                <div className="text-center mb-16">
                                   <p className="font-heading text-purple-500 text-xs uppercase tracking-[0.4em] mb-4">INVESTMENT GUIDE</p>
                                   <h2 className="text-5xl md:text-6xl font-heading uppercase italic tracking-tighter">FAQ.</h2>
                                </div>
                                <div className="space-y-4">
                                  {faqs.map((faq, index) => (
                                    <div key={index} className="rounded-sm border border-white/5 bg-black/40 backdrop-blur-md overflow-hidden transition-all shadow-lg">
                                      <button onClick={() => setActiveFaq(activeFaq === index ? null : index)} className="w-full px-8 py-6 flex items-center justify-between text-left group">
                                        <span className="font-heading italic uppercase tracking-widest text-sm text-white/80 group-hover:text-white transition-colors">{faq.q}</span>
                                        <Icon name="chevron-down" className={`transition-transform duration-500 text-purple-500 ${activeFaq === index ? 'rotate-180' : ''}`} />
                                      </button>
                                      {activeFaq === index && (
                                        <div className="px-8 pb-8 text-white/50 text-sm leading-relaxed font-medium animate-fade-in">
                                          {faq.a}
                                        </div>
                                      )}
                                    </div>
                                  ))}
                                </div>
                            </div>
                            
                            <footer className="mt-40 pt-20 border-t border-white/5 opacity-20 font-mono text-[9px] uppercase tracking-[0.4em]">
                                © 2026 MUHAMMAD FADLAN ISKANDAR — DEPOK
                            </footer>
                        </div>
                    )}

                    {/* MODAL VIDEO */}
                    {selectedVideo && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 md:p-10 bg-black/95 backdrop-blur-2xl animate-fade-in text-white text-left" onClick={() => setSelectedVideo(null)}>
                            <div className="relative w-full max-w-5xl bg-[#0a0a0a] border border-white/10 shadow-3xl overflow-hidden rounded-sm" onClick={e => e.stopPropagation()}>
                                <button className="absolute top-6 right-6 text-white hover:text-purple-500 z-50 transition-colors" onClick={() => setSelectedVideo(null)}><Icon name="x" size={30} /></button>
                                <div className="aspect-video bg-black">
                                    <iframe src={selectedVideo.videoUrl} className="w-full h-full border-0 text-white" allowFullScreen></iframe>
                                </div>
                                <div className="p-10 text-left">
                                    <span className="text-[10px] font-bold uppercase tracking-widest text-purple-500 mb-2 block">{selectedVideo.category}</span>
                                    <h2 className="text-3xl md:text-5xl font-heading uppercase italic tracking-tighter mb-4 text-white">{selectedVideo.title}</h2>
                                    <p className="text-white/50 text-lg font-medium leading-relaxed max-w-3xl border-l-2 border-purple-600 pl-6 text-justify">{selectedVideo.desc}</p>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
