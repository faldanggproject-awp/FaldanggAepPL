        .font-mono {

        /* Seamless Downward Grid Animation */
        .bg-grid-pattern {
            background-size: 50px 50px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            animation: gridScrollDown 20s linear infinite;
        }

        @keyframes gridScrollDown {
            0% { background-position: 0 0; }
            100% { background-position: 0 50px; }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #050505;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #9333ea;
        }

        /* Marquee Animation */
        @keyframes marquee {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }

        .animate-marquee {
            display: inline-flex;
            animation: marquee 25s linear infinite;
            white-space: nowrap;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }

                                    </button>
                                </div>

                                <div className="grid grid-cols-3 gap-8 sm:gap-16 border-t border-white/10 pt-8 max-w-xl w-full">
                                    <div>
                                        <span className="block text-2xl sm:text-3xl font-black italic">50+</span>
                                        <span className="text-[10px] font-mono text-white/40 uppercase tracking-widest">Proyek Selesai</span>
                                    </div>
                                    <div>
                                        <span className="block text-2xl sm:text-3xl font-black italic">2023</span>
                                        <span className="text-[10px] font-mono text-white/40 uppercase tracking-widest">Sejak Memulai</span>
                                    </div>
                                    <div>
                                        <span className="block text-2xl sm:text-3xl font-black italic">100%</span>
                                        <span className="text-[10px] font-mono text-white/40 uppercase tracking-widest">Kepuasan</span>
                                    </div>
                                </div>
                            </section>

                            {/* MARQUEE TRUSTED CLIENT LOGOS */}
                            <section className="py-10 border-y border-white/10 bg-black/50 overflow-hidden">
                                <div className="max-w-7xl mx-auto px-6 mb-6 text-center">
                                    <span className="font-mono text-[10px] uppercase tracking-[0.3em] text-white/40 block">TRUSTED INDUSTRY PARTNERS</span>
                                </div>
                                <div className="flex overflow-hidden">
                                    <div className="animate-marquee flex items-center gap-12 sm:gap-16">
                                        {}
                                        {clientLogos.concat(clientLogos).map((logo, idx) => (
                                            <div key={idx} className="flex items-center gap-3 grayscale opacity-60 hover:grayscale-0 hover:opacity-100 transition-all duration-300 shrink-0">
                                                <img 
                                                    src={logo.url} 
                                                    alt={logo.name} 
                                                    referrerPolicy="no-referrer"
                                                    className="h-8 sm:h-10 object-contain max-w-[120px]" 
                                                    onError={(e) => {
                                                        e.target.style.display = 'none';
                                                        if (e.target.nextSibling) {
                                                            e.target.nextSibling.style.display = 'inline-block';
                                                        }
                                                    }}
                                                />
                                                <span className="hidden font-mono text-xs font-bold uppercase tracking-widest text-white/80 border border-white/15 px-3.5 py-1.5 rounded-lg bg-white/5 backdrop-blur-md">
                                                    {logo.name}
                                                </span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </section>

                            {/* ABOUT ME SECTION (CLEAN TEXT-ONLY) */}
                            <section id="about" className="py-28 px-6 max-w-5xl mx-auto text-center">
                                <div className="flex justify-center items-center gap-4 mb-6">
                                    <div className="w-12 h-[2px] bg-purple-500"></div>
                                    <span className="font-mono text-xs uppercase tracking-widest text-purple-400">Tentang Saya</span>
                                    <div className="w-12 h-[2px] bg-purple-500"></div>
                                </div>

                                <div className="flex justify-end mb-8">
                                    <button onClick={() => setLangAbout(langAbout === 'ID' ? 'EN' : 'ID')} className="font-mono text-[10px] border border-white/20 px-3 py-1 rounded-md hover:bg-white/10 transition-colors uppercase">
                                        Bahasa: {langAbout}
                                    </button>
                                </div>

                                {langAbout === 'ID' ? (
                                    <h2 className="text-2xl sm:text-4xl font-extrabold leading-relaxed tracking-tight mb-12">
                                        Saya <span className="text-purple-400 italic">Muhammad Fadlan Iskandar</span>, Video Editor & Motion Graphics Designer berbasis di Indonesia. Sejak 2023, saya berfokus mengolah footage mentah menjadi sajian karya visual yang menarik, dinamis, dan sinematik.
                                    </h2>
                                ) : (
                                    <h2 className="text-2xl sm:text-4xl font-extrabold leading-relaxed tracking-tight mb-12">
                                        I am <span className="text-purple-400 italic">Muhammad Fadlan Iskandar</span>, an Indonesia-based Video Editor & Motion Designer. Dedicated to turning raw footage into impactful, engaging, and cinematic visual stories.
                                    </h2>
                                )}

                                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-4 font-mono text-xs uppercase tracking-wider">
                                    {['After Effects', 'Premiere Pro', 'Illustrator', 'VFX & SFX', 'Typography', 'Storytelling'].map((skill, idx) => (
                                        <div key={idx} className="p-4 bg-white/5 border border-white/10 rounded-xl hover:border-purple-500/50 hover:bg-purple-500/10 transition-all">
                                            {skill}
                                        </div>
                                    ))}
                                </div>
                            </section>

                            {/* PORTFOLIO GALLERY ARCHIVE */}
                            <section id="work" className="py-20 px-6 max-w-7xl mx-auto border-t border-white/10">
                                <div className="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-12">
                                    <div>
                                        <span className="font-mono text-xs text-purple-400 uppercase tracking-widest block mb-2">• KARYA ARSIP</span>
                                        <h2 className="text-4xl sm:text-5xl font-black italic uppercase tracking-tighter">PORTFOLIO.</h2>
                                    </div>

                                    {/* LEVEL 1: MAIN CATEGORY TABS */}
                                    <div className="flex flex-wrap gap-2 bg-white/5 p-1.5 rounded-xl border border-white/10">
                                        {['Semua', 'Video Editing', 'Animasi'].map((cat) => (
                                            <button 
                                                key={cat}
                                                onClick={() => handleMainCategoryChange(cat)}
                                                className={`px-5 py-2 rounded-lg font-mono text-xs uppercase tracking-wider transition-all ${activeCategory === cat ? 'bg-purple-600 text-white font-bold shadow-lg shadow-purple-600/30' : 'text-white/60 hover:text-white'}`}
                                            >
                                                {cat}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* LEVEL 2: NESTED SUB-CATEGORY TABS */}
                                {activeCategory === 'Video Editing' && (
                                    <div className="flex gap-3 mb-10 overflow-x-auto pb-2 border-b border-white/5">
                                        {['Semua', 'Talking Head', 'VFX'].map((sub) => (
                                            <button
                                                key={sub}
                                                onClick={() => setActiveSubCategory(sub)}
                                                className={`px-4 py-1.5 rounded-full text-xs font-mono uppercase tracking-wider transition-all border ${activeSubCategory === sub ? 'bg-purple-500/20 border-purple-500 text-purple-300' : 'border-white/10 text-white/40 hover:text-white'}`}
                                            >
                                                {sub === 'Semua' ? 'Semua Video Editing' : sub}
                                            </button>
                                        ))}
                                    </div>
                                )}

                                {activeCategory === 'Animasi' && (
                                    <div className="flex gap-3 mb-10 overflow-x-auto pb-2 border-b border-white/5">
                                        {['Semua', 'Motion Graphics'].map((sub) => (
                                            <button
                                                key={sub}
                                                onClick={() => setActiveSubCategory(sub)}
                                                className={`px-4 py-1.5 rounded-full text-xs font-mono uppercase tracking-wider transition-all border ${activeSubCategory === sub ? 'bg-purple-500/20 border-purple-500 text-purple-300' : 'border-white/10 text-white/40 hover:text-white'}`}
                                            >
                                                {sub === 'Semua' ? 'Semua Animasi' : sub}
                                            </button>
                                        ))}
                                    </div>
                                )}

                                {/* VIDEO GRID */}
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {filteredProjects.map((project) => (
                                        <div 
                                            key={project.id} 
                                            onClick={() => setSelectedVideo(project)}
                                            className="group relative bg-white/5 border border-white/10 rounded-2xl overflow-hidden cursor-pointer hover:border-purple-500/50 transition-all duration-300 flex flex-col"
                                        >
                                            <div className={`relative w-full overflow-hidden bg-black flex items-center justify-center ${project.isVertical ? 'aspect-[9/16] max-h-[420px]' : 'aspect-video'}`}>
                                                <div className="absolute inset-0 bg-gradient-to-t from-black via-black/20 to-transparent z-10 opacity-80 group-hover:opacity-40 transition-opacity"></div>
                                                
                                                <div className="w-14 h-14 rounded-full bg-purple-600/80 border border-purple-400 flex items-center justify-center text-white z-20 group-hover:scale-110 transition-transform shadow-xl shadow-purple-600/40">
                                                    <PlayIcon />
                                                </div>

                                                <span className="absolute top-4 left-4 z-20 bg-black/60 backdrop-blur-md text-white/80 font-mono text-[10px] px-3 py-1 rounded-full border border-white/10 uppercase">
                                                    {project.subCategory}
                                                </span>
                                            </div>

                                            <div className="p-5 flex-1 flex flex-col justify-between">
                                                <div>
                                                    <h3 className="font-bold text-lg group-hover:text-purple-400 transition-colors mb-2">{project.title}</h3>
                                                    <p className="text-xs text-white/50 leading-relaxed line-clamp-2">{project.desc}</p>
                                                </div>

                                                <div className="mt-4 pt-4 border-t border-white/5 flex items-center justify-between font-mono text-[10px] text-purple-400 uppercase tracking-widest font-bold">
                                                    <span>Putar Video</span>
                                                    <ArrowRightIcon />
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </section>

                        </main>
                    ) : (
                        /* PRICE LIST PAGE */
                        <main className="pt-32 pb-20 px-6 max-w-7xl mx-auto">
                            <div className="text-center max-w-3xl mx-auto mb-16">
                                <span className="font-mono text-xs uppercase tracking-widest text-purple-400 block mb-3">• PANDUAN INVESTASI</span>
                                <h1 className="text-5xl sm:text-6xl font-black italic uppercase tracking-tighter mb-6">DAFTAR HARGA.</h1>
                                <p className="text-white/60 font-mono text-xs uppercase tracking-widest leading-relaxed">
                                    Solusi visual profesional untuk menaikkan kelas konten Anda.
                                </p>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-3 gap-8 mb-24">
                                {pricingPlans.map((plan, idx) => (
                                    <div key={idx} className={`p-8 rounded-2xl border flex flex-col justify-between relative bg-white/5 ${plan.popular ? 'border-purple-500 bg-purple-950/20 shadow-2xl shadow-purple-600/20' : 'border-white/10'}`}>
                                        {plan.popular && (
                                            <span className="absolute -top-3 right-6 bg-purple-600 text-white font-mono text-[10px] px-3 py-1 rounded-full font-bold uppercase tracking-widest">
                                                Paling Populer
                                            </span>
                                        )}
                                        <div>
                                            <h3 className="text-xl font-bold italic uppercase tracking-wider mb-2">{plan.title}</h3>
                                            <div className="text-3xl font-black mb-6 text-purple-400">{plan.price} <span className="text-xs font-normal text-white/40 font-mono">/ Menit</span></div>
                                            <ul className="space-y-3 mb-8 font-mono text-xs text-white/70">
                                                {plan.features.map((feat, fIdx) => (
                                                    <li key={fIdx} className="flex items-center gap-2">
                                                        <span className="text-purple-400">✓</span> {feat}
                                                    </li>
                                                ))}
                                            </ul>
                                        </div>

                                        <button onClick={() => handleOrder(plan.title)} className={`w-full py-4 rounded-xl font-mono text-xs font-bold uppercase tracking-widest transition-all ${plan.popular ? 'bg-purple-600 hover:bg-purple-500 text-white shadow-lg shadow-purple-600/30' : 'bg-white/10 hover:bg-white/20 text-white'}`}>
                                            Pesan Sekarang
                                        </button>
                                    </div>
                                ))}
                            </div>

                            {/* FAQ ACCORDION */}
                            <div className="max-w-3xl mx-auto border-t border-white/10 pt-16">
                                <h2 className="text-3xl font-black italic uppercase tracking-tight text-center mb-10">FREQUENTLY ASKED QUESTIONS.</h2>
                                <div className="space-y-4">
                                    {faqs.map((faq, index) => (
                                        <div key={index} className="border border-white/10 rounded-xl overflow-hidden bg-white/5">
                                            <button onClick={() => setActiveFaq(activeFaq === index ? null : index)} className="w-full p-5 text-left font-bold flex justify-between items-center hover:text-purple-400 transition-colors">
                                                <span>{faq.q}</span>
                                                <ChevronDownIcon className={activeFaq === index ? 'rotate-180 transition-transform' : 'transition-transform'} />
                                            </button>
                                            {activeFaq === index && (
                                                <div className="p-5 border-t border-white/5 text-sm text-white/60 leading-relaxed font-mono">
                                                    {faq.a}
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </main>
                    )}

                    {/* --- FOOTER --- */}
                    <footer className="border-t border-white/10 py-12 px-6 text-center text-white/40 font-mono text-xs uppercase tracking-widest">
                        <div className="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
                            <span>© 2026 Muhammad Fadlan Iskandar — Faldangg.aep</span>
                            <div className="flex gap-6">
                                <a href="https://www.instagram.com/faldangg.aep/" target="_blank" rel="noopener noreferrer" className="hover:text-purple-400"><InstagramIcon /></a>
                                <a href="https://www.tiktok.com/@fadlaniskandarpro" target="_blank" rel="noopener noreferrer" className="hover:text-purple-400"><TikTokIcon className="w-6 h-6" /></a>
                            </div>
                        </div>
                    </footer>

                    {/* --- VIDEO PLAYBACK MODAL --- */}
                    {selectedVideo && (
                        <div className="fixed inset-0 z-50 bg-black/95 backdrop-blur-xl flex items-center justify-center p-4 sm:p-8 animate-fade-in">
                            <div className={`relative w-full bg-[#0a0a0a] border border-white/10 rounded-2xl overflow-hidden shadow-2xl flex flex-col ${selectedVideo.isVertical ? 'max-w-md' : 'max-w-5xl'}`}>
                                <div className="p-4 border-b border-white/10 flex justify-between items-center bg-black/50">
                                    <span className="font-mono text-xs uppercase text-purple-400 font-bold tracking-wider">{selectedVideo.category} • {selectedVideo.subCategory}</span>
                                    <button onClick={() => setSelectedVideo(null)} className="p-2 hover:bg-white/10 rounded-full transition-colors text-white">
                                        <XIcon />
                                    </button>
                                </div>

                                <div className={`w-full bg-black flex items-center justify-center ${selectedVideo.isVertical ? 'aspect-[9/16] max-h-[75vh]' : 'aspect-video'}`}>
                                    {isDirectVideo(selectedVideo.videoUrl) ? (
                                        <video src={selectedVideo.videoUrl} controls autoPlay className="w-full h-full object-contain"></video>
                                    ) : (
                                        <iframe src={selectedVideo.videoUrl} className="w-full h-full border-0" allow="autoplay; encrypted-media" allowFullScreen></iframe>
                                    )}
                                </div>

                                <div className="p-6 bg-[#0a0a0a]">
                                    <h3 className="text-xl font-bold uppercase tracking-tight mb-2">{selectedVideo.title}</h3>
                                    <p className="text-xs text-white/60 font-mono">{selectedVideo.desc}</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* --- SOCIAL PROOF NOTIFICATION POPUP (PRICES PAGE ONLY) --- */}
                    {currentPage === 'prices' && activeNotification && (
                        <div className="fixed bottom-6 left-6 z-50 bg-[#111] border border-purple-500/40 p-4 rounded-xl shadow-2xl flex items-center gap-4 animate-fade-in max-w-xs">
                            <div className="w-10 h-10 rounded-full bg-purple-600/20 text-purple-400 flex items-center justify-center font-bold">
                                <ShoppingBagIcon />
                            </div>
                            <div className="font-mono text-xs">
                                <span className="font-bold text-white block">{activeNotification.name} dari {activeNotification.city}</span>
                                <span className="text-white/60 text-[10px]">Baru saja memesan Paket <span className="text-purple-400 font-bold">{activeNotification.package}</span></span>
                            </div>
                        </div>
                    )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
