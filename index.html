                                            <span className="font-mono text-[10px] text-white/40 block mb-4">{plan.duration}</span>
                                            <div className="text-3xl sm:text-4xl font-black tracking-tight italic mb-8">{plan.price}</div>

                                            <div className="space-y-3 border-t border-white/10 pt-6 mb-8">
                                                {plan.features.map((feat, fIdx) => (
                                                    <div key={fIdx} className="flex items-start gap-3 font-mono text-xs text-white/80">
                                                        <span className="text-purple-400 font-bold">•</span>
                                                        <span>{feat}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        <button 
                                            onClick={() => handleOrder(priceCategories[selectedPriceCategory].title, plan.title)}
                                            className={`w-full py-4 rounded-xl font-mono text-xs font-bold uppercase tracking-widest transition-all active:scale-95 ${
                                                plan.popular 
                                                    ? 'bg-purple-600 hover:bg-purple-500 text-white shadow-lg shadow-purple-600/30' 
                                                    : 'bg-white/10 hover:bg-white/20 text-white'
                                            }`}
                                        >
                                            Pesan Paket
                                        </button>
                                    </div>
                                ))}
                            </div>

                            {/* FAQ SECTION */}
                            <section className="max-w-3xl mx-auto border-t border-white/10 pt-16">
                                <div className="text-center mb-10">
                                    <span className="font-mono text-xs text-purple-400 uppercase tracking-widest block mb-2">• FREQUENTLY ASKED QUESTIONS</span>
                                    <h2 className="text-3xl font-black italic uppercase tracking-tight">FAQ.</h2>
                                </div>

                                <div className="space-y-4">
                                    {faqs.map((faq, idx) => (
                                        <div key={idx} className="border border-white/10 rounded-2xl bg-white/5 overflow-hidden">
                                            <button 
                                                onClick={() => setActiveFaq(activeFaq === idx ? null : idx)}
                                                className="w-full p-5 text-left font-bold text-sm sm:text-base flex justify-between items-center gap-4 hover:text-purple-300 transition-colors"
                                            >
                                                <span>{faq.q}</span>
                                                <ChevronDownIcon className={`transition-transform duration-300 ${activeFaq === idx ? 'rotate-180 text-purple-400' : 'text-white/40'}`} />
                                            </button>
                                            {activeFaq === idx && (
                                                <div className="px-5 pb-5 text-xs sm:text-sm font-mono text-white/60 border-t border-white/5 pt-3 leading-relaxed">
                                                    {faq.a}
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </section>
                        </main>
                    )}

                    {/* --- FOOTER --- */}
                    <footer className="border-t border-white/10 py-12 px-6 text-center bg-black/80">
                        <div className="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-6">
                            <div>
                                <span className="font-mono text-[10px] text-white/40 uppercase tracking-widest block mt-1">© 2026 Muhammad Fadlan Iskandar. All rights reserved.</span>
                            </div>

                            <div className="flex items-center gap-6">
                                <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" className="text-white/60 hover:text-purple-400 transition-colors">
                                    <InstagramIcon />
                                </a>
                                <a href="https://tiktok.com" target="_blank" rel="noopener noreferrer" className="text-white/60 hover:text-purple-400 transition-colors">
                                    <TikTokIcon className="w-6 h-6" />
                                </a>
                            </div>
                        </div>
                    </footer>

                    {/* --- HYBRID VIDEO MODAL --- */}
                    {selectedVideo && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 bg-black/90 backdrop-blur-md animate-fade-in">
                            <div className="bg-[#0f0f0f] border border-white/10 rounded-3xl overflow-hidden max-w-4xl w-full max-h-[90vh] flex flex-col relative shadow-2xl">
                                
                                <div className="flex justify-between items-center p-5 border-b border-white/10 bg-black/40">
                                    <div>
                                        <span className="font-mono text-[10px] text-purple-400 uppercase tracking-widest block">{selectedVideo.category} • {selectedVideo.subCategory}</span>
                                        <h3 className="font-extrabold text-lg sm:text-xl tracking-tight">{selectedVideo.title}</h3>
                                    </div>
                                    <button 
                                        onClick={() => setSelectedVideo(null)}
                                        className="w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center transition-all active:scale-90"
                                    >
                                        <XIcon />
                                    </button>
                                </div>

                                <div className="flex-1 bg-black flex items-center justify-center overflow-hidden">
                                    {isDirectVideo(selectedVideo.videoUrl) ? (
                                        <video 
                                            src={selectedVideo.videoUrl} 
                                            controls 
                                            autoPlay 
                                            className="w-full max-h-[70vh] object-contain"
                                        />
                                    ) : (
                                        <iframe 
                                            src={selectedVideo.videoUrl} 
                                            className="w-full h-[60vh] sm:h-[70vh]" 
                                            allow="autoplay"
                                            title={selectedVideo.title}
                                        ></iframe>
                                    )}
                                </div>

                                <div className="p-5 border-t border-white/10 bg-black/40 font-mono text-xs text-white/60">
                                    {selectedVideo.desc}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* --- SOCIAL PROOF POPUP (PRICES PAGE ONLY) --- */}
                    {activeNotification && (
                        <div className="fixed bottom-6 right-6 z-50 bg-black/90 border border-purple-500/40 rounded-2xl p-4 shadow-2xl backdrop-blur-md flex items-center gap-3 animate-fade-in max-w-xs">
                            <div className="w-3 h-3 rounded-full bg-purple-500 animate-ping shrink-0"></div>
                            <div>
                                <p className="font-mono text-xs font-bold text-white">
                                    {activeNotification.name} dari {activeNotification.city}
                                </p>
                                <p className="font-mono text-[10px] text-purple-300">
                                    Baru saja memesan paket <span className="font-bold underline">{activeNotification.package}</span>!
                                </p>
                            </div>
                        </div>
                    )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
