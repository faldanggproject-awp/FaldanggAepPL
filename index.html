        .moving-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: 50px 50px;
            background-image:

                                        src={logoUrl}

                                        <a href="#about" className="hover:text-purple-500 transition-colors">About</a>
                                        <a href="#work" className="hover:text-purple-500 transition-colors">Archive</a>

                    {currentPage === 'portfolio' ? (

                            {/* HERO SECTION */}
                            <section id="hero" className="min-h-screen flex items-center justify-center pt-20 px-6 text-center relative overflow-hidden">
                                <div className="absolute inset-10 pointer-events-none opacity-40 z-0">
                                    <div className="vf-corner top-0 left-0 border-t-2 border-l-2"></div>

                                    <div className="vf-corner bottom-0 left-0 border-b-2 border-l-2"></div>
                                    <div className="vf-corner bottom-0 right-0 border-b-2 border-r-2"></div>

                                    <div className="inline-flex items-center gap-3 px-5 py-2 rounded-full border border-white/10 bg-white/5 backdrop-blur-md mb-8 shadow-xl">

                                            <div className="w-1.5 h-1.5 rounded-full bg-red-600 animate-pulse"></div>

                                    </div>

                                    <h1 className="text-[14vw] sm:text-[10vw] font-heading leading-[0.82] uppercase mb-8 italic drop-shadow-2xl glow-text">
                                        FADLAN <span className="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-white">ISKANDAR.</span>
                                    </h1>
                                    <p className="max-w-xl mx-auto text-white/40 text-xs md:text-sm font-bold uppercase tracking-widest mb-12 leading-relaxed text-center text-white">Transforming ideas into visual masterpieces through high-end motion design and cinematic editing.</p>
                                    <div className="flex flex-col sm:flex-row justify-center gap-4 mb-20 text-white text-center">

                                        <button onClick={() => setCurrentPage('prices')} className="bg-white/5 border border-white/10 hover:bg-white/10 px-8 py-3 rounded-sm font-black uppercase text-[10px] tracking-widest transition-all">Price List</button>
                                    </div>
                                </div>
                            </section>

                            <div className="bg-white text-black py-3 overflow-hidden border-y border-black relative z-20 flex">
                                <div className="animate-marquee flex items-center text-black">
                                    <span className="font-heading uppercase italic tracking-tighter text-lg sm:text-2xl mx-4">VIDEO EDITING • MOTION GRAPHICS • VISUAL EFFECTS • 2D ANIMATION • COLOR GRADING • CINEMATIC STORYTELLING •</span>

                            {}

                                <div className="max-w-7xl mx-auto px-6 text-center">
                                    <p className="text-[10px] font-mono uppercase tracking-[0.3em] text-white/30 mb-10">Trusted by Leading Creators & Agencies</p>
                                    <div className="flex flex-wrap justify-center items-center gap-6 sm:gap-8">
                                        {clientLogos.map((logo, index) => (
                                            <div key={index} className="flex items-center justify-center bg-white/5 border border-white/10 p-3 rounded-lg w-20 h-20 sm:w-24 sm:h-24 hover:border-purple-600 hover:bg-purple-950/15 transition-all duration-300 hover:scale-105 shadow-md">
                                                <img 
                                                    src={logo} 
                                                    className="max-w-full max-h-full object-contain rounded-md opacity-45 hover:opacity-100 grayscale hover:grayscale-0 transition-all duration-300" 
                                                    alt={"Client Logo " + index} 
                                                    onError={(e) => { e.target.src = "https://placehold.co/100x100/1a1a1a/ffffff?text=Logo"; }}

                                        ))}
                                    </div>
                                </div>

                            <section id="about" className="py-32 px-6 bg-black/40 backdrop-blur-sm border-b border-white/5">
                                <div className="max-w-4xl mx-auto text-center">
                                    <div className="inline-flex items-center gap-4 justify-center mb-10">
                                        <div className="w-8 h-1 bg-purple-600"></div>
                                        <h2 className="text-4xl md:text-6xl font-heading uppercase italic tracking-tighter">About Me.</h2>
                                        <div className="w-8 h-1 bg-purple-600"></div>
                                    </div>
                                    <p className="text-white/80 text-xl md:text-2xl font-medium leading-relaxed mb-16 text-center">
                                        I am Muhammad Fadlan Iskandar, a <span className="text-purple-400 font-black italic">Video Editor & Motion Designer</span> based in Indonesia. Since 2023, I have dedicated myself to transforming every piece of raw footage into a visual masterpiece with a definitive Wow factor.
                                    </p>
                                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-4">
                                        {[
                                            {n: <LayersIcon size={16} />, l:'AE'}, {n: <ClapperboardIcon size={16} />, l:'PR'}, 
                                            {n: <LayoutIcon size={16} />, l:'AI'}, {n: <TvIcon size={16} />, l:'PS'}, 
                                            {n: <ZapIcon size={16} />, l:'VFX'}, {n: <CameraIcon size={16} />, l:'CINEMA'}
                                        ].map((item, idx) => (
                                            <div key={idx} className="bg-white/5 border border-white/5 p-5 rounded-sm flex flex-col items-center justify-center gap-3 group hover:border-purple-600 transition-all text-white">
                                                <span className="text-purple-500 group-hover:scale-110 transition-transform">{item.n}</span>
                                                <span className="text-[10px] font-bold uppercase tracking-widest text-white/50">{item.l}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </section>

                            {}
                            {/* SHOWREEL SECTION */}
                            <section id="showreel" className="py-32 px-6 text-center showreel-gradient relative z-10">
                                <div className="max-w-7xl mx-auto">
                                    <div className="mb-16">
                                        <h2 className="text-5xl md:text-7xl font-heading font-black uppercase italic tracking-tighter mb-4 text-white">The Master Reel.</h2>
                                        <p className="text-purple-400 font-mono text-[10px] uppercase tracking-[0.4em]">Highlighting Best Creative Projects</p>
                                    </div>
                                    <div className="group relative aspect-video w-full rounded-sm overflow-hidden border border-white/10 bg-black cursor-pointer shadow-3xl text-left" onClick={() => setSelectedVideo(showreelData)}>
                                        <div className="absolute inset-0 bg-purple-900/10 group-hover:bg-purple-900/20 transition-all duration-700 flex items-center justify-center text-center">
                                            <div className="w-24 h-24 rounded-full border border-white/20 flex items-center justify-center group-hover:scale-110 group-hover:bg-purple-600 group-hover:border-purple-600 transition-all duration-500 shadow-2xl text-center">
                                                <PlayIcon size={32} fill="white" className="text-white ml-1" />
                                            </div>
                                        </div>
                                        <div className="absolute bottom-10 left-10 text-left text-white">
                                            <span className="bg-white text-black px-4 py-1 text-[9px] font-bold uppercase tracking-widest mb-4 inline-block">Featured</span>
                                            <h3 className="text-3xl font-heading uppercase italic tracking-tight text-white">Project Showcase 2024-2026</h3>
                                        </div>
                                    </div>
                                </div>
                            </section>

                            {}
                            {/* ARCHIVE GRID (HIERARCHICAL TABS FOR EASY EXPLORATION) */}
                            <section id="work" className="py-32 px-6 border-t border-white/5 text-left text-white">
                                <div className="max-w-7xl mx-auto text-white text-left">
                                    <div className="flex flex-col mb-12 gap-6 text-left">
                                        <h2 className="text-5xl font-heading font-extrabold uppercase italic tracking-tighter text-white">Archive.</h2>
                                        
                                        {/* Kategori Utama */}
                                        <div className="flex flex-wrap gap-2 p-1.5 bg-white/5 rounded-sm self-start">
                                            {mainCategories.map(cat => (
                                                <button 
                                                    key={cat} 
                                                    onClick={() => selectCategory(cat)} 
                                                    className={"text-[10px] font-black uppercase tracking-widest px-6 py-2.5 transition-all rounded-sm " + (activeCategory === cat ? "bg-purple-600 text-white shadow-lg" : "hover:bg-white/10 text-white/50")}
                                                >
                                                    {cat}
                                                </button>
                                            ))}
                                        </div>

                                        {/* Sub Kategori Dinamis */}
                                        {activeCategory !== 'All' && subCategoriesMap[activeCategory] && (
                                            <div className="flex flex-wrap gap-2 p-1 border border-white/10 bg-black/40 rounded-sm self-start animate-fade-in">
                                                {subCategoriesMap[activeCategory].map(sub => (
                                                    <button 
                                                        key={sub} 
                                                        onClick={() => setActiveSubcategory(sub)} 
                                                        className={"text-[9px] font-bold uppercase tracking-wider px-4 py-2 transition-all rounded-sm " + (activeSubcategory === sub ? "bg-white/10 text-purple-400 border border-purple-500/30" : "hover:text-white text-white/40")}
                                                    >
                                                        {sub === 'All' ? 'All ' + activeCategory : sub}
                                                    </button>
                                                ))}
                                            </div>
                                        )}
                                    </div>

                                    {/* Hasil Proyek Terpilih */}
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 text-left text-white">
                                        {filteredProjects.map(p => (
                                            <div key={p.id} className="group relative aspect-square bg-[#0a0a0a] border border-white/5 rounded-sm overflow-hidden cursor-pointer shadow-2xl text-white text-left" onClick={() => setSelectedVideo(p)}>
                                                <div className={"absolute inset-0 z-0 bg-gradient-to-br transition-all duration-700 opacity-60 group-hover:opacity-100 " + (p.subcategory === 'Talking Head' ? 'from-blue-600/40' : p.subcategory === 'VFX' ? 'from-rose-600/40' : p.subcategory === 'Motion Graphics' ? 'from-purple-600/40' : 'from-emerald-600/40') + " to-black text-white"}></div>
                                                <div className="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all duration-500 scale-75 group-hover:scale-100 text-center">
                                                    <div className="bg-white text-black p-4 rounded-full shadow-2xl text-center text-white">
                                                        <PlayIcon size={30} fill="black" className="text-black ml-0.5" />
                                                    </div>
                                                </div>
                                                <div className="absolute bottom-8 left-8 text-left text-white text-left">
                                                    <div className="flex items-center gap-2 mb-2 text-white text-left">
                                                        <div className={"w-1.5 h-1.5 rounded-full " + (p.category === 'Video Editing' ? 'bg-blue-500' : 'bg-purple-500') + " text-white"}></div>
                                                        <span className="text-[9px] uppercase font-bold text-white/40 tracking-[0.2em] text-white text-left">{p.category + " • " + p.subcategory}</span>
                                                    </div>
                                                    <h3 className="text-xl font-heading uppercase italic tracking-tight text-white">{p.title}</h3>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </section>

                            <footer className="py-32 px-6 border-t border-white/5 bg-black/60 text-center text-white">
                                <h2 className="text-6xl md:text-9xl font-heading font-black uppercase italic tracking-tighter mb-16 opacity-90 text-center text-white flex justify-center">Let's Connect.</h2>
                                <div className="flex justify-center gap-12 mb-20 text-white text-center">
                                    <a href="https://www.instagram.com/faldangg.aep/" target="_blank" className="hover:text-purple-500 transition-all transform hover:-translate-y-2 text-white text-center">
                                        <InstagramIcon size={40} />
                                    </a>
                                    <a href="https://www.tiktok.com/@fadlaniskandarpro" target="_blank" className="hover:text-purple-500 transition-all transform hover:-translate-y-2 text-white flex items-center text-white text-center"><TikTokIcon size={40} /></a>
                                </div>
                                <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6 font-mono text-[9px] uppercase font-bold tracking-[0.4em] opacity-20 text-white text-center">
                                    <span>© 2026 MUHAMMAD FADLAN ISKANDAR</span>
                                    <div className="flex gap-8 text-white text-center"><span>UTC+7 DEPOK</span><span>{whatsappNumber}</span></div>
                                </div>
                            </footer>
                        </div>
                    ) : (
                        /* PRICES PAGE */
                        <div className="pt-40 px-6 pb-32 animate-fade-in text-center max-w-7xl mx-auto text-white">

                            <p className="text-white/40 font-bold uppercase tracking-widest text-[10px] mb-20 text-center text-white">Choose the best professional visual package for your needs.</p>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-8 mb-40 text-left text-white">
                                {pricingPlans.map(plan => (
                                    <div key={plan.title} className={"p-10 border relative overflow-hidden transition-all duration-500 " + (plan.popular ? "border-purple-600 bg-[#0c0c0c]/80 shadow-2xl scale-105 z-10" : "border-white/5 bg-white/5 opacity-80") + " text-white text-left"}>
                                        {plan.popular && <div className="absolute top-0 right-0 bg-purple-600 text-white text-[9px] font-bold px-4 py-1 uppercase tracking-widest text-white text-left">BEST SELLER</div>}

                                        <div className="text-4xl font-bold text-purple-500 mb-10 tracking-tighter text-white text-left">{plan.price}<span className="text-xs text-white/30 font-bold ml-2 text-white/50">/ MIN</span></div>
                                        <div className="space-y-4 mb-12 text-white text-left">
                                            {plan.features.map(f => (
                                                <div key={f} className="flex items-center gap-3 text-[10px] font-bold uppercase tracking-widest text-white/70 text-white text-left"><CheckIcon size={14} color="#a855f7" /> {f}</div>
                                            ))}
                                        </div>
                                        <button onClick={() => window.open("https://wa.me/" + whatsappNumber + "?text=Hi Fadlan, I want to book the " + plan.title + " package.")} className="w-full bg-purple-600 hover:bg-purple-500 py-5 font-bold uppercase text-[11px] tracking-widest transition-all text-white text-center">Book Now</button>
                                    </div>
                                ))}
                            </div>

                            {/* FAQ */}
                            <div className="max-w-3xl mx-auto mt-40 text-left text-white">
                                <div className="text-center mb-16 text-white">
                                   <p className="font-heading text-purple-500 text-xs uppercase tracking-[0.4em] mb-4 text-center">INVESTMENT GUIDE</p>
                                   <h2 className="text-5xl md:text-6xl font-heading uppercase italic tracking-tighter text-center text-white">FAQ.</h2>
                                </div>
                                <div className="space-y-4 text-white text-left">
                                  {faqs.map((faq, index) => (
                                    <div key={index} className="rounded-sm border border-white/5 bg-black/40 backdrop-blur-md overflow-hidden transition-all shadow-lg text-white text-left">
                                      <button onClick={() => setActiveFaq(activeFaq === index ? null : index)} className="w-full px-8 py-6 flex items-center justify-between text-left group text-white">
                                        <span className="font-heading italic uppercase tracking-widest text-sm text-white/80 group-hover:text-white transition-colors text-white text-left">{faq.q}</span>
                                        <ChevronDownIcon size={18} className={"transition-transform duration-500 text-purple-500 " + (activeFaq === index ? "rotate-180" : "")} />
                                      </button>
                                      {activeFaq === index && (
                                        <div className="px-8 pb-8 text-white/50 text-sm leading-relaxed font-medium animate-fade-in text-left text-white/50">{faq.a}</div>
                                      )}
                                    </div>
                                  ))}
                                </div>
                            </div>
                            <footer className="mt-40 pt-20 border-t border-white/5 opacity-20 font-mono text-[9px] uppercase tracking-[0.4em] text-white text-center">© 2026 MUHAMMAD FADLAN ISKANDAR — DEPOK</footer>
                        </div>
                    )}

                    {}
                    {/* LIVE NOTIFICATION REVIEW (SOCIAL PROOF) */}
                    {activeNotification && (
                        <div className="fixed bottom-6 left-6 z-[150] bg-black/95 border border-purple-500/30 p-5 rounded-lg shadow-[0_10px_50px_rgba(168,85,247,0.25)] flex flex-col gap-3 animate-slide-in-up max-w-sm backdrop-blur-md">
                            <div className="flex items-center justify-between w-full border-b border-white/10 pb-2">
                                <div className="flex items-center gap-1">
                                    <span className="text-yellow-500 text-xs">★</span>
                                    <span className="text-yellow-500 text-xs">★</span>
                                    <span className="text-yellow-500 text-xs">★</span>
                                    <span className="text-yellow-500 text-xs">★</span>
                                    <span className="text-yellow-500 text-xs">★</span>
                                </div>
                                <span className="text-[8px] font-mono font-black uppercase text-purple-400 bg-purple-950/40 border border-purple-500/20 px-2 py-0.5 rounded-sm">Verified Client</span>
                            </div>
                            <div className="text-left">
                                <p className="text-xs font-bold text-white leading-tight">
                                    {activeNotification.name} <span className="text-white/40 text-[10px] font-normal font-mono">({activeNotification.city})</span>
                                </p>
                                <p className="text-[9px] text-purple-300 font-mono uppercase tracking-wider mt-0.5">
                                    Paket: {activeNotification.package}
                                </p>
                                <p className="text-[11px] text-white/80 mt-2 italic leading-relaxed text-left border-l-2 border-purple-500 pl-2">
                                    "{activeNotification.text}"
                                </p>
                            </div>
                        </div>
                    )}

                    {}
                    {/* MODAL VIDEO PLAYBACK */}
                    {selectedVideo && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 md:p-10 bg-black/95 backdrop-blur-2xl animate-fade-in text-white text-left" onClick={() => setSelectedVideo(null)}>
                            <div className="relative w-full max-w-5xl bg-[#0a0a0a] border border-white/10 shadow-3xl overflow-hidden rounded-sm text-white text-left" onClick={e => e.stopPropagation()}>
                                <button className="absolute top-6 right-6 text-white hover:text-purple-500 z-50 transition-colors" onClick={() => setSelectedVideo(null)}><XIcon size={30} /></button>
                                <div className="aspect-video bg-black text-left text-white flex items-center justify-center">
                                    {selectedVideo.videoUrl.includes('raw=1') ? (
                                        <video 
                                            src={selectedVideo.videoUrl} 
                                            className="w-full h-full object-contain animate-fade-in" 
                                            controls 
                                            autoPlay
                                        />
                                    ) : (
                                        <iframe src={selectedVideo.videoUrl} className="w-full h-full border-0 text-white text-left" allowFullScreen></iframe>
                                    )}
                                </div>
                                <div className="p-10 text-left text-white">
                                    <span className="text-[10px] font-bold uppercase tracking-widest text-purple-500 mb-2 block text-white">{selectedVideo.category}</span>
                                    <h2 className="text-3xl md:text-5xl font-heading uppercase italic tracking-tighter mb-4 text-white">{selectedVideo.title}</h2>
                                    <p className="text-white/50 text-lg font-medium leading-relaxed max-w-3xl border-l-2 border-purple-600 pl-6 text-justify text-white">{selectedVideo.desc}</p>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
